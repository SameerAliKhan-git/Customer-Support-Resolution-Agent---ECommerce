[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-resolution-agent"
version = "1.0.0"
description = "A practical Agentic AI project for Forward Deployed Engineers with LangGraph, FastAPI, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ElectroVault AI Engineering" }]
dependencies = [
    "fastapi>=0.115.0",
    "PyJWT[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.14.0",
    "numpy>=2.0.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20"
    , "langgraph-checkpoint-sqlite>=3.1,<4"
    , "langgraph-checkpoint-postgres>=3.2,<4"
    , "psycopg[binary,pool]>=3.2,<4"
    , "asyncpg>=0.30,<1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "mock_services*", "evals*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "policies/documents/*.md"]
