name: CI Safety Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Regression, Migrations & PostgreSQL Safety Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript Syntax
        run: |
          node --check app/static/app.js
          node --check app/static/session.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Verify Alembic Zero Schema Drift (SQLite)
        run: |
          python -m scripts.migrate
          python -m alembic check

      - name: Verify PostgreSQL Migrations & Zero Schema Drift
        env:
          SYNC_DATABASE_URL: postgresql+psycopg://support:postgres-ci-password@localhost:5432/support_test
          CHECKPOINT_DATABASE_URL: postgresql://support:postgres-ci-password@localhost:5432/support_test
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run Full Test Suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://support:postgres-ci-password@localhost:5432/support_test
        run: |
          python -m pytest --disable-warnings -v

      - name: Verify Process Restart Recovery
        run: |
          python -m scripts.verify_restart

      - name: Run Synthetic Evaluation Suite
        run: |
          python -m evals.run_evals
